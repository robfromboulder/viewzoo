      <path d="M0 1.5 L10 5 L0 8.5" fill="none" stroke="#f3f7fc" stroke-width="1.4"/>
    </marker>
    <marker id="arr-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9" fill="none" stroke="#ffd447" stroke-width="1.6"/>
    </marker>
    <marker id="tick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M2 9 L8 1" stroke="#f3f7fc" stroke-width="1.4"/>
    </marker>

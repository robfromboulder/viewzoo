services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "7720:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  trino:
    image: trinodb/trino:478
    ports:
      - "7721:8080"
    volumes:
      - ${PROJECT_ROOT}/target/viewzoo-478:/usr/lib/trino/plugin/viewzoo
      - ./trino/catalog:/etc/trino/catalog
    tmpfs:
      - /tmp/viewzoo:uid=1000,gid=1000
    depends_on:
      postgres:
        condition: service_healthy
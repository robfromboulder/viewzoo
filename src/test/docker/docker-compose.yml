services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: secretpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  trino:
    image: trinodb/trino:483
    ports:
      - "7721:8080"
    volumes:
      - ${PROJECT_ROOT}/target/viewzoo-483:/usr/lib/trino/plugin/viewzoo
      - ./trino/catalog:/etc/trino/catalog
      - ${PROJECT_ROOT}/target/testfsmount:/var/viewzoo
    depends_on:
      postgres:
        condition: service_healthy